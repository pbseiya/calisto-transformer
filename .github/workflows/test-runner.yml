name: Test Self-Hosted Runner

on:
  workflow_dispatch:
  push:
    branches: [test-runner]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test runner environment
        run: |
          echo "✅ Runner is working!"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"
          echo "OS: $(uname -a)"
          echo ""
          echo "📂 Directory contents:"
          ls -la
          echo ""
          echo "🔧 Available tools:"
          which node || echo "Node.js not found"
          which npm || echo "npm not found"
          which python3 || echo "Python3 not found"
          which git || echo "Git not found"
          echo ""
          echo "📊 System info:"
          df -h .
          free -h

      - name: Test Node.js (if available)
        run: |
          if command -v node &> /dev/null; then
            echo "Node version: $(node --version)"
            echo "npm version: $(npm --version)"
          else
            echo "Node.js not installed on this runner"
          fi

      - name: Test Python (if available)
        run: |
          if command -v python3 &> /dev/null; then
            echo "Python version: $(python3 --version)"
            pip3 --version || echo "pip3 not found"
          else
            echo "Python3 not installed on this runner"
          fi
