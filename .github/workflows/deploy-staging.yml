name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  STAGING_PORT: 3002
  STAGING_URL: http://localhost:3002

jobs:
  # ============================================
  # Deploy to Staging
  # ============================================
  deploy:
    name: 🚀 Deploy to Staging
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://100.123.214.57/dga-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Pull latest code
        run: |
          cd ~/projects/calisto-transformer
          git fetch origin
          git checkout develop
          git reset --hard origin/develop
          echo "✅ Code updated to $(git rev-parse --short HEAD)"

      - name: Install dependencies
        run: |
          cd ~/projects/calisto-transformer/dga-nextjs
          npm ci
          echo "✅ Dependencies installed"

      - name: Build application
        run: |
          cd ~/projects/calisto-transformer/dga-nextjs
          npm run build 2>&1 | tee /tmp/staging-build.log
          
          if grep -q "Type error" /tmp/staging-build.log; then
            echo "❌ Build failed: TypeScript errors"
            exit 1
          fi
          
          echo "✅ Build successful"

      - name: Deploy to staging
        run: |
          cd ~/projects/calisto-transformer/dga-nextjs
          
          # Stop existing staging if running
          pm2 delete dga-staging 2>/dev/null || true
          
          # Start staging on port 3002
          PORT=3002 pm2 start npm --name "dga-staging" -- start
          
          # Wait for startup
          sleep 8
          
          # Verify process is running
          if ! pm2 describe dga-staging | grep -q "online"; then
            echo "❌ Staging failed to start"
            pm2 logs dga-staging --lines 20 --nostream
            exit 1
          fi
          
          echo "✅ Staging deployed on port 3002"

      - name: Health check
        run: |
          echo "Waiting for staging to be ready..."
          sleep 5
          
          # Test staging endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/dga/login)
          
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ] && [ "$HTTP_CODE" != "308" ]; then
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            pm2 logs dga-staging --lines 30 --nostream
            exit 1
          fi
          
          echo "✅ Health check passed"

      - name: Smoke test
        run: |
          echo "Running smoke tests..."
          
          # Test login page loads
          curl -s http://localhost:3002/dga/login | grep -q "Sign In" || {
            echo "❌ Login page failed"
            exit 1
          }
          
          # Test API endpoint
          curl -s http://localhost:3002/dga/api/devices | head -c 100 | grep -q "\[" || {
            echo "⚠️ API might have issues (non-critical)"
          }
          
          echo "✅ Smoke tests passed"

      - name: Notify success
        if: success()
        run: |
          echo "🎉 Staging deployment successful!"
          echo "URL: https://100.123.214.57/dga-staging"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: develop"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed!"
          echo "Check logs: pm2 logs dga-staging"
          exit 1
